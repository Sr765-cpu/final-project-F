<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account – EventNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background:
        radial-gradient(140% 160% at 10% 0%, rgba(0, 210, 255, 0.18), transparent 45%),
        radial-gradient(120% 180% at 100% 0%, rgba(108, 99, 255, 0.22), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.16);
      padding: 2.25rem 2rem;
      box-shadow: 0 28px 60px rgba(0,0,0,.6);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1.25rem;
      color: var(--soft-pink);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-header h1 {
      font-size: clamp(1.9rem, 4.5vw, 2.5rem);
      margin: 0 0 0.4rem 0;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, #2EE6FF, #46A0FF, #00D2FF);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-header p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body class="aurora-body">
  <main class="login-page">
    <div class="login-container">
      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="login-header">
        <h1>Create Account</h1>
        <p>Fill in your details to get started with Event Nest.</p>
      </div>

      <form id="register-form-standalone" class="login-form" novalidate>
        <div class="field">
          <label for="first-name">First Name</label>
          <input id="first-name" name="firstName" type="text" required>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <input id="last-name" name="lastName" type="text" required>
        </div>
        <div class="field">
          <label for="contact-number">Contact Number</label>
          <input id="contact-number" name="contactNumber" type="tel" placeholder="e.g., +91 98765 43210" required>
        </div>
        <div class="field">
          <label for="email-address">Email Address</label>
          <input id="email-address" name="email" type="email" required>
        </div>
        <div class="field password-field">
          <label for="new-password">Create New Password</label>
          <div class="password-wrap">
            <input id="new-password" name="password" type="password" minlength="6" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="register-back">Back</button>
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer" aria-label="Footer">
    <div class="footer-grid">
      <div>
        <h3>EVENT NEST - NESTING IDEAS,CRAFTING EXPERIENCE <span class="group">&lt;CodeInc&gt;</span></h3>
        <p>contact@connecthub.example</p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <ul class="links">
          <li><a href="index.html#reviews">Reviews</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_a25vd24ta29pLTYyLmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://known-koi-62.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script src="auth.js"></script>

  <script>
    (function() {
      const MAX_TRIES = 20;
      const RETRY_DELAY = 200;

      function updateNav() {
        const loginLink = document.getElementById('login-link');
        const loginText = document.getElementById('login-text');
        if (!loginLink) return;

        const user = window.Clerk && window.Clerk.user;

        // Reset any previous click handler
        loginLink.onclick = null;

        if (user) {
          // Signed in: show Logout and sign out via Clerk
          loginLink.href = '#';
          if (loginText) loginText.textContent = 'Logout';
          else loginLink.textContent = 'Logout';

          loginLink.onclick = async (event) => {
            event.preventDefault();
            try {
              if (window.Clerk) {
                await window.Clerk.load();
                await window.Clerk.signOut();
              }
            } catch (err) {
              console.error('Failed to sign out via Clerk on register page:', err);
            } finally {
              window.location.href = 'index.html';
            }
          };
        } else {
          // Signed out: simple Login link
          loginLink.href = 'login.html';
          if (loginText) loginText.textContent = 'Login';
          else loginLink.textContent = 'Login';
        }
      }

      function startClerkNav() {
        let tries = 0;

        const tryLoad = async () => {
          tries++;

          if (window.Clerk) {
            try {
              await window.Clerk.load();
            } catch (err) {
              console.error('Failed to load Clerk on register page:', err);
            }

            updateNav();
          } else if (tries < MAX_TRIES) {
            setTimeout(tryLoad, RETRY_DELAY);
          } else {
            updateNav();
          }
        };

        tryLoad();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startClerkNav);
      } else {
        startClerkNav();
      }
    })();
  </script>

  <script>
    // Standalone register handler: simple client-side validation then redirect to dashboard
    (function(){
      const form = document.getElementById('register-form-standalone');
      if(!form) return;

      const backBtn = document.getElementById('register-back');
      if (backBtn) {
        backBtn.addEventListener('click', function(){
          window.location.href = 'login.html';
        });
      }

      form.addEventListener('submit', async function(e){
        e.preventDefault();

        const first = document.getElementById('first-name');
        const last = document.getElementById('last-name');
        const contact = document.getElementById('contact-number');
        const email = document.getElementById('email-address');
        const password = document.getElementById('new-password');

        if(!first.value.trim() || !last.value.trim() || !contact.value.trim() || !email.value.trim() || !password.value.trim()){
          alert('Please fill all fields.');
          return;
        }

        const emailVal = email.value.trim();
        const passwordVal = password.value.trim();
        const digitsOnly = contact.value.replace(/\D/g, '');

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(emailVal)) {
          alert('Please enter a valid email address.');
          return;
        }

        const hasUpper = /[A-Z]/.test(passwordVal);
        const hasLower = /[a-z]/.test(passwordVal);
        const hasNumber = /[0-9]/.test(passwordVal);

        if (passwordVal.length < 8 || !hasUpper || !hasLower || !hasNumber) {
          alert('Password must be at least 8 characters and include uppercase, lowercase, and a number.');
          return;
        }

        if (digitsOnly.length < 8) {
          alert('Please enter a valid contact number.');
          return;
        }

        if (typeof AuthService === 'undefined') {
          alert('Authentication service not available. Please refresh the page.');
          return;
        }

        const payload = {
          role: 'participant',
          name: (first.value.trim() + ' ' + last.value.trim()).trim(),
          email: emailVal,
          address: contact.value.trim(),
          password: passwordVal
        };

        try {
          await AuthService.register(payload);
          window.location.href = 'dashboard2.html';
        } catch (err) {
          console.error('Registration failed:', err);
          alert(err.message || 'Registration failed. Please try again.');
        }
      });
    })();
  </script>
</body>
</html>
